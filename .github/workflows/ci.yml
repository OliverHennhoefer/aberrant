name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its older, now pointless run; runs on
# main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.18"

jobs:
  minimal-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.11

      - name: Install base dependencies only
        run: uv sync --locked --no-dev

      - name: Base install smoke
        run: |
          uv run --locked --no-dev python - <<'PY'
          import aberrant
          from aberrant.base import Pipeline
          from aberrant.compose import GraphNode, GraphPipeline, MergeNode, Select
          from aberrant.model import NullModel, QuantileThreshold, RandomModel, ThresholdModel
          from aberrant.model.iforest import OnlineIsolationForest
          from aberrant.model.stat import MovingCovariance
          from aberrant.transform.preprocessing import StandardScaler

          assert isinstance(aberrant.__version__, str)
          assert NullModel().score_one({"x": 1.0}) == 0.0
          assert 0.0 <= RandomModel().score_one({"x": 1.0}) <= 1.0
          assert ThresholdModel(ceiling=1.0).score_one({"x": 2.0}) == 1.0
          q = QuantileThreshold()
          q.learn_one({"score": 0.1})
          _ = q.score_one({"score": 0.1})
          p = StandardScaler() | OnlineIsolationForest()
          assert isinstance(p, Pipeline)
          graph = GraphPipeline(
              [
                  GraphNode("left", Select(["x"])),
                  GraphNode("right", Select(["y"])),
                  MergeNode("features", ("left", "right")),
              ],
              MovingCovariance(window_size=8),
              output="features",
              model_minimum_updates=2,
          )
          graph.learn_one({"x": 1.0, "y": 2.0})
          graph.learn_one({"x": 2.0, "y": 3.0})
          assert graph.readiness.ready
          assert isinstance(graph.score_one({"x": 3.0, "y": 4.0}), float)
          PY

      - name: Lowest supported dependencies smoke
        run: |
          uv venv .venv-lowest --python 3.11
          VIRTUAL_ENV=.venv-lowest uv pip install --resolution lowest-direct .
          .venv-lowest/bin/python -I - <<'PY'
          import numpy

          from aberrant.drift import ADWIN, KSWIN
          from aberrant.model.iforest import HalfSpaceTrees, OnlineIsolationForest
          from aberrant.model.timeseries import XLagDAMP
          from aberrant.transform import StandardScaler

          print("numpy", numpy.__version__)
          detectors = [
              StandardScaler() | OnlineIsolationForest(seed=1),
              HalfSpaceTrees(seed=1),
              XLagDAMP(subsequence_length=8),
          ]
          drifts = [ADWIN(), KSWIN(seed=1)]
          for index in range(300):
              value = float(index % 17) / 17.0
              for detector in detectors:
                  event = {"x": value} if isinstance(detector, XLagDAMP) else {"x": value, "y": 1.0 - value}
                  detector.score_one(event)
                  detector.learn_one(event)
              for drift in drifts:
                  drift.update(value)
          PY

  lint-type-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Pull requests test Windows on the oldest and newest Python only;
        # main runs the whole matrix.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked python -m ruff check .

      - name: Ruff format
        run: uv run --locked python -m ruff format --check .

      - name: Mypy
        run: uv run --locked python -m mypy aberrant

      - name: Unit tests
        run: uv run --locked python -m pytest tests --ignore=tests/integration -n auto -q

  extras-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.11

      - name: Install extras
        run: uv sync --locked --extra faiss

      - name: Extras import smoke
        run: |
          uv run --locked python - <<'PY'
          from aberrant.model.deep import Autoencoder, OnlineAutoencoderEnsemble
          from aberrant.similarity import FaissSimilaritySearchEngine

          assert Autoencoder is not None
          assert OnlineAutoencoderEnsemble is not None
          engine = FaissSimilaritySearchEngine(window_size=8, warm_up=2)
          engine.append({"x": 0.0, "y": 0.0})
          engine.append({"x": 1.0, "y": 1.0})
          assert isinstance(engine.search({"x": 0.5, "y": 0.5}, n_neighbors=1), float)
          PY

      - name: Compare ECOD and COPOD with PyOD
        run: uv run --locked --with "pyod==3.6.9" python -m pytest tests/models/test_stat_ecdf.py -k pyod_aggregation_matches_pyod -q

      - name: FAISS model smoke tests
        run: |
          uv run --locked python -m pytest tests/models/test_distance_knn.py tests/test_catalog_faiss.py tests/transformers/test_pca_pipeline.py -q
          uv run --locked python -m pytest tests/test_stream_longevity_forests_distance.py -k faiss -q
          uv run --locked python -m pytest tests/test_public_imports_extras.py -q
          uv run --locked python -m pytest tests/integration/test_detection_quality.py -k knn-faiss -q

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Integration smoke
        run: uv run --locked python -m pytest tests/integration -n auto -q

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # tokenless Codecov upload via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.11

      # FAISS is installed so the coverage report includes the FAISS engine,
      # which the extras job tests.
      - name: Install dependencies
        run: uv sync --locked --extra faiss

      - name: Coverage
        run: uv run --locked python -m pytest tests --ignore=tests/integration -n auto --cov=aberrant --cov-report=xml --cov-report=term-missing:skip-covered -q

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        # Fork pull requests cannot mint an OIDC token; skip them instead of failing.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build
