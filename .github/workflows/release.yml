name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  UV_VERSION: "0.9.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra faiss

      - name: Ruff
        run: uv run --locked python -m ruff check .

      - name: Mypy
        run: uv run --locked python -m mypy aberrant

      - name: Test suite
        run: uv run --locked python -m pytest -q

      - name: Build distributions
        run: uv build

      - name: Wheel smoke test
        run: |
          uv venv .venv-smoke --python 3.11
          VIRTUAL_ENV=.venv-smoke uv pip install dist/*.whl
          . .venv-smoke/bin/activate
          python - <<'PY'
          from aberrant.model import ThresholdModel
          from aberrant.model.iforest import OnlineIsolationForest
          from aberrant.transform.preprocessing import StandardScaler

          model = ThresholdModel(ceiling=1.0)
          assert model.score_one({"x": 2.0}) == 1.0
          pipeline = StandardScaler() | OnlineIsolationForest()
          pipeline.learn_one({"x": 0.0, "y": 1.0})
          assert isinstance(pipeline.score_one({"x": 0.1, "y": 0.9}), float)
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/aberrant
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
