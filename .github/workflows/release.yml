name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra faiss

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --locked python - <<'PY'
          import os

          import aberrant

          expected_tag = f"v{aberrant.__version__}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match package version "
                  f"{aberrant.__version__!r}; expected {expected_tag!r}."
              )
          PY

      - name: Ruff
        run: uv run --locked python -m ruff check .

      - name: Ruff format
        run: uv run --locked python -m ruff format --check .

      - name: Mypy
        run: uv run --locked python -m mypy aberrant

      - name: Test suite
        run: uv run --locked python -m pytest -q

      - name: Build distributions
        run: uv build

      - name: Wheel smoke test
        run: |
          uv venv .venv-smoke --python 3.11
          VIRTUAL_ENV=.venv-smoke uv pip install dist/*.whl
          . .venv-smoke/bin/activate
          python -I - <<'PY'
          import sys
          from pathlib import Path

          import aberrant
          from aberrant.model import ThresholdModel
          from aberrant.model.iforest import OnlineIsolationForest
          from aberrant.transform.preprocessing import StandardScaler

          package_path = Path(aberrant.__file__).resolve()
          environment_path = Path(sys.prefix).resolve()
          assert package_path.is_relative_to(environment_path), package_path

          model = ThresholdModel(ceiling=1.0)
          assert model.score_one({"x": 2.0}) == 1.0
          pipeline = StandardScaler() | OnlineIsolationForest()
          pipeline.learn_one({"x": 0.0, "y": 1.0})
          assert isinstance(pipeline.score_one({"x": 0.1, "y": 0.9}), float)
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/aberrant
    permissions:
      # Trusted publishing to PyPI.
      id-token: write
      # Create the GitHub release once the upload has succeeded.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          # Lets a re-run of this job retry the GitHub release step.
          skip-existing: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}.")
          Path("release-notes.md").write_text(match.group(1).strip() + "\n")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
