[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "aberrant"
dynamic = ["version"]
description = "Real-time anomaly detection for data streams"
authors = [
    { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" },
    { name = "Pascal Heinzelmann" },
    { name = "Marius Hoell" },
    { name = "Marco Catoir" }
]
maintainers = [
  { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [
    "anomaly detection",
    "outlier detection",
    "streaming",
    "data streams",
    "online learning",
    "real-time",
    "time series anomaly detection",
    "online forecasting",
    "graph anomaly detection",
    "isolation forest",
    "half-space trees",
    "concept drift",
    "drift detection",
    "unsupervised learning",
    "iot",
    "fraud detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.3",
]

[project.optional-dependencies]
eval = ["scikit-learn>=1.9.1"]
dl = ["torch>=2.6.0"]
faiss = ["faiss-cpu>=1.10.0"]
all = ["aberrant[eval,dl,faiss]"]

[dependency-groups]
dev = [
    "ruff>=0.8.0,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "mypy>=1.13.0,<3.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    # Reference implementations that tests compare against.
    "scipy>=1.17.1,<2.0.0",
    "torch>=2.6.0,<3.0.0",
]
docs = [
    "zensical>=0.0.45,<0.1.0",
    "mkdocstrings-python>=2.0.7,<3.0.0",
    "pygments>=2.20.0",
]
security = ["pip-audit==2.10.1"]
notebooks = [
    "ipykernel>=6.29.0,<8.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "nbclient>=0.10.0,<1.0.0",
    "nbformat>=5.10.0,<6.0.0",
]
benchmark = [
    "river>=0.22.0,<1.0.0",
]

[project.urls]
"Homepage" = "https://oliverhennhoefer.github.io/aberrant"
"Documentation" = "https://oliverhennhoefer.github.io/aberrant"
"Source" = "https://github.com/OliverHennhoefer/aberrant"
"Issues" = "https://github.com/OliverHennhoefer/aberrant/issues"
"Changelog" = "https://github.com/OliverHennhoefer/aberrant/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "aberrant/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".github", ".pre-commit-config.yaml", "codecov.yml"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-m", "not benchmark"]
markers = [
    "benchmark: slow quality checks; the nightly Benchmark workflow runs them",
]
xfail_strict = true

[tool.coverage.run]
source = ["aberrant"]
branch = true

[tool.coverage.report]
# Bodies that never run by design: abstract methods, typing overloads and
# imports that exist only for the type checker.
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "if TYPE_CHECKING:",
]

[tool.uv]
required-version = ">=0.12.18"
# Keep development and audit tooling above their patched dependency floors.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "msgpack>=1.2.3",
    "setuptools>=84.1.0",
    "virtualenv>=21.14.10",
]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value used in comparison
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["aberrant"]

[tool.ruff.lint.per-file-ignores]
# StrEnum changes the string representation of these public catalog enums.
"aberrant/catalog/_specs.py" = ["UP042"]

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

